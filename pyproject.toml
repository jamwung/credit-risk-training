[project]
name = "credit-risk-training"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.8",
    "dagster-webserver>=1.13.8",
    "duckdb>=1.5.3",
    "lightgbm>=4.6.0",
    "mlflow>=3.13.0",
    "optuna>=4.9.0",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
